name: BudLight Cup alerts

on:
  schedule:
    - cron: "5 11-23 * * *"   # hourly, 7 AM–7 PM Montreal (EDT); the script picks what to send by local time
    - cron: "5 0-4 * * *"     # hourly, 8 PM–midnight Montreal (EDT)
  workflow_dispatch:          # "Run workflow" button for manual tests
    inputs:
      mode:
        description: "auto, weekly, daily, hourly or goalies"
        default: "auto"

permissions:
  contents: write             # lets the job save state.json back to the repo

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run alerts
        env:
          LEAGUE_ID: "1562575461"
          TEAM_ID: "3"
          YEAR: "2027"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python fantasy_alerts.py "${{ inputs.mode || 'auto' }}"
      - name: Save state
        if: always()
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add state.json snapshot.json || exit 0
          git commit -m "update alert state" || exit 0
          git pull --rebase || true
          git push || true
